# ============================================================
# AI Driving Assistant — Runtime Configuration
# All tunable parameters live here. No hardcoded values in src/
# ============================================================

source:
  # "file" to read from a video file, "webcam" to use a live camera feed
  type: "file"

  # Path to the video file (used only when type == "file")
  file_path: "data/sample_videos/sample2.mp4"

  # Webcam device index (used only when type == "webcam")
  webcam_index: 0

# ============================================================
# Day 8: Pipeline working resolution
# ============================================================
# Every incoming frame is resized to this resolution BEFORE any stage
# runs. Benefits:
#   1. Canny+Hough drop from ~180 ms → ~15 ms (the #1 bottleneck fix).
#   2. Lane-detection thresholds were calibrated for 720p — running at
#      4K caused wrong-side lane assignments and noisy Hough output.
#   3. All downstream stages (YOLO, MiDaS, draw calls) get faster.
# The display window still uses display.width/height for final output.
# Set both to null to disable (pass raw source resolution through).
pipeline:
  resize_width: 1280
  resize_height: 720

display:
  # Target window size for display (width x height). Set to null to use source resolution.
  width: 1280
  height: 720

  # Window title
  window_title: "AI Driving Assistant"

output:
  # Whether to save the processed output to a video file
  save_video: false

  # Output file path (used only when save_video == true)
  output_path: "output/processed_output.avi"

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Optional log file path. Set to null to log to console only.
  log_file: null

# ============================================================
# Day 2: Object Detection + Tracking
# ============================================================
detection:
  # YOLOv8 model weights to use.
  # "yolov8n.pt" (nano) is recommended for real-time CPU inference.
  # "yolov8s.pt" (small) gives ~5% better mAP at ~half the CPU FPS.
  # The file is downloaded automatically on first run if not present.
  model_path: "yolov8n.pt"

  # Minimum confidence score to keep a detection (0.0 – 1.0).
  # Lower = more detections but more false positives.
  confidence_threshold: 0.4

  # COCO class names to detect. All others are silently discarded.
  classes:
    - "person"
    - "bicycle"
    - "car"
    - "motorcycle"
    - "bus"
    - "truck"

  # Inference device. "auto" detects CUDA if available, falls back to CPU.
  # Override with "cpu" or "cuda" to force a specific device.
  device: "auto"

  # YOLOv8 internal inference resolution (square, pixels).
  # The model letterboxes input to this size regardless of the frame size.
  # 640 = training default (best accuracy). 480 = ~20% faster, minimal drop.
  # After the pipeline resize stage, frames are already 1280×720, so the
  # gain from lowering imgsz is moderate but measurable.
  imgsz: 640

  # ByteTrack tuning parameters
  tracker:
    # Confidence threshold to *activate* (start) a new track.
    # Lower = tracks start sooner but ID noise increases.
    track_activation_threshold: 0.25

    # Number of frames to keep a track alive after it goes undetected.
    # Higher = better recovery from occlusion; lower = IDs released faster.
    lost_track_buffer: 30

    # Minimum IoU overlap required to match a detection to an existing track.
    minimum_matching_threshold: 0.8

    # Source video frame rate — used by the Kalman filter's motion model.
    # Set to match your video's actual FPS for best results.
    frame_rate: 30

# ============================================================
# Day 3: Classical Lane Detection (Canny + Hough Transform)
# ============================================================
lanes:
  # Canny edge detection thresholds.
  # At 1280x720 (pipeline working resolution after resize stage):
  #   low=30, high=80 is a good baseline for dashcam footage with road markings.
  canny_low_threshold: 30
  canny_high_threshold: 80

  # Gaussian blur kernel size (must be an odd number).
  blur_kernel_size: 5

  # ── Camera geometry (tune once per camera mounting) ──────────────────────
  # Road vanishing point as [x_fraction, y_fraction] of the frame: where the
  # lane markings meet on the horizon. Lane segments that don't point at it
  # are rejected as noise (cracks, shadows, barriers, car edges), and it
  # anchors the default ego corridor when markings aren't visible.
  # Turn on debug_overlay below to see it drawn as a magenta cross.
  #
  # Presets for the two sample clips:
  #   sample2.mp4 (low, wide-angle, no hood):  vanishing_point [0.51, 0.47]
  #       roi_polygon [[0,1],[1,1],[1,0.66],[0.56,0.52],[0.44,0.52],[0,0.66]]
  #   sample.mp4  (high mount, hood in view):  vanishing_point [0.50, 0.21]
  #       roi_polygon [[0,0.56],[1,0.56],[1,0.42],[0.56,0.28],[0.44,0.28],[0,0.42]]
  # (Also switch depth.camera_height_m / camera_hfov_deg — see depth below.)
  vanishing_point: [0.51, 0.47]

  # Max horizontal distance (fraction of frame width) by which a segment's
  # extended line may miss the vanishing point and still count as a lane mark.
  vp_tolerance: 0.08

  # ROI polygon — [x_fraction, y_fraction] points of the road region searched
  # for lane markings. Any number of points. The bottom edge must stay above
  # the car's hood (if visible); the top edge must stay below the horizon.
  # Wide-angle cameras need a wide polygon: their lane lines are shallow and
  # leave the frame at the sides rather than at the bottom.
  roi_polygon:
    - [0.00, 1.00]   # bottom-left
    - [1.00, 1.00]   # bottom-right
    - [1.00, 0.66]   # right edge
    - [0.56, 0.52]   # top-right
    - [0.44, 0.52]   # top-left
    - [0.00, 0.66]   # left edge

  # Ego-lane corridor used when lane markings are NOT detected: straight lines
  # from these x positions (fraction of width) at the ROI bottom up to the
  # vanishing point. Keeps the in-ego-lane check (and so collision alerts)
  # working on roads with faded or missing markings.
  default_lane_bottom_x: [0.10, 0.90]

  # Hough transform.
  # At 1280x720: min_line_length=40 means a segment must span 40/1280=3.1% of
  # frame width — this eliminates road-texture noise hits that at 4K (25px=0.65%)
  # were flooding the classifier and causing left/right swap.
  hough_threshold: 20
  hough_min_line_length: 40
  hough_max_line_gap: 80

  # Minimum |slope| (dy/dx) for a lane segment. Wide-angle cameras see lane
  # lines as shallow as ~0.25, so keep this lower than for a narrow dashcam.
  min_abs_slope: 0.2

  # Segments within this distance of each other (fraction of frame width,
  # measured at the ROI bottom) belong to the same lane marking. Only the
  # innermost marking on each side is used — the ego-lane boundary.
  lane_cluster_tolerance: 0.08

  # Drop a side's smoothed line after this many consecutive frames without a
  # valid detection, so stale lines don't linger.
  max_missed_frames: 15

  # Temporal smoothing (frames to average over).
  smoothing_frames: 7

  # Debug overlay: set true to see Canny edges + ROI outline on screen.
  debug_overlay: false

  # Show the green lane fill and lines overlay.
  show_lane_overlay: true

# ============================================================
# Day 4: Monocular Depth Estimation
# ============================================================
depth:
  # How each object's distance is estimated:
  #   "ground_plane" — distance = f · camera_height / (box_bottom − horizon_row),
  #                    with the horizon taken from lanes.vanishing_point. Metric
  #                    and stable for vehicles/pedestrians on a flat road.
  #   "midas"        — calibration_scale / MiDaS relative inverse depth. Kept for
  #                    comparison; on the sample clips it barely tracks real
  #                    distance (MiDaS depth has an unknown scale AND shift).
  # Objects at/above the horizon get no distance with ground_plane (beyond
  # reliable range); MiDaS is only the fallback if there is no lane stage.
  distance_method: "ground_plane"

  # ── Camera calibration for ground_plane (tune once per camera) ──────────
  # Measured from the sample2.mp4 footage: camera height from the apparent
  # width of a 3.66 m US interstate lane, focal length from the spacing of
  # dashed lane markings (one dash + gap = 40 ft = 12.2 m).
  #   sample2.mp4: camera_height_m 1.16, camera_hfov_deg 41
  #   sample.mp4:  camera_height_m 1.90, camera_hfov_deg 54
  camera_height_m: 1.16
  # Horizontal field of view of the (uncropped) video frame, in degrees.
  camera_hfov_deg: 41

  # Distances are clamped to this value (meters).
  max_distance_m: 200

  # Model variant. Options:
  #   "midas_small"  — Fastest (~2 MB weights), good for real-time on CPU.
  #   "midas_hybrid" — Better quality (~120 MB), noticeably slower on CPU.
  #   "midas_large"  — Best quality (~1.2 GB), impractical without a GPU.
  # Weights are downloaded automatically via torch.hub on first run.
  model_name: "midas_small"

  # Internal inference resolution. The model resizes frames to this size
  # before running depth estimation, then upscales back to frame size.
  # Lower = faster but coarser depth maps. 256 is a good CPU default.
  # GPU users can increase to 384 or 512 for sharper edges.
  input_resolution: 256

  # Inference device. "auto" detects CUDA if available, falls back to CPU.
  device: "auto"

  # Heuristic scale for distance_method "midas" (and the fallback):
  # pseudo_distance = calibration_scale / normalized_inverse_depth.
  # NOT a physical calibration. 8.0 is the median fit against ground-plane
  # distances on sample2.mp4 (the old value, 30, put most cars at ~200 m).
  calibration_scale: 8.0

  # Show the colorized depth heatmap as a picture-in-picture overlay
  # in the bottom-right corner of the display. (visualization.show_depth_panel
  # overrides this.) With distance_method "ground_plane" and the heatmap off,
  # MiDaS doesn't run at all — a large CPU saving.
  show_heatmap_overlay: true

  # Run MiDaS inference only every N frames; reuse the cached depth map
  # for the in-between frames. This is the single biggest CPU FPS lever:
  #   skip_frames: 1  → run every frame  (~0.7 fps on CPU)
  #   skip_frames: 3  → run every 3rd    (~2.5 fps on CPU)  ← default
  #   skip_frames: 5  → run every 5th    (~3.5 fps on CPU)
  # Distances update slightly less frequently but TTC smoothing absorbs this.
  skip_frames: 3

# ============================================================
# Day 5: Temporal Fusion — Closing Speed, TTC & Collision Risk
# ============================================================
fusion:
  # Number of frames of distance history to keep per tracked object.
  # More frames = smoother closing-speed estimates, but slower to react
  # to sudden speed changes. 10 frames at 30 fps ≈ 0.33 s of history.
  history_length: 10

  # Expire stale track histories after this many seconds without update.
  # Prevents ghost entries from objects that left the frame. Should be
  # longer than the tracker's lost_track_buffer / frame_rate.
  history_timeout_seconds: 2.0

  # TTC thresholds for risk classification (seconds).
  # TTC < danger  → DANGER   (object will reach us in < 2 s)
  # TTC < caution → CAUTION  (2–4 s window)
  # TTC ≥ caution → SAFE     (comfortable margin)
  ttc_danger_threshold: 2.0
  ttc_caution_threshold: 4.0

  # Minimum data points required before trusting a TTC estimate.
  # At least 3 points are needed for a meaningful linear fit — with
  # 1-2 noisy points the slope estimate is unreliable.
  min_history_points: 3

  # Closing speeds above this (m/s) are treated as measurement noise, not
  # a threat. 40 m/s = 144 km/h relative — beyond any same-direction traffic.
  # Guards against distance jitter near the horizon (1 px = many meters).
  max_closing_speed_mps: 40

# ============================================================
# Day 6: Alert System — Debounce, Priority & Sound
# ============================================================
alerts:
  # DANGER must persist this many consecutive frames before triggering the
  # driver-facing alert. This prevents single-frame noise spikes from
  # triggering false alarms. At 30 fps, 5 frames = ~167 ms of persistence.
  danger_persist_frames: 5

  # Once triggered, the alert must see this many consecutive clear frames
  # before it dismisses. Asymmetry (5 to trigger, 10 to clear) is intentional:
  # it's safer to keep the warning visible slightly longer than to dismiss too
  # quickly while the driver is still processing the threat.
  clear_persist_frames: 10

  # Play a short audio beep (880 Hz sine wave) when a new DANGER alert
  # triggers. Requires: pip install sounddevice
  # Set to false for headless environments or silent demo recordings.
  sound_enabled: false

# ============================================================
# Day 6: Visualization Toggles — Debug Mode vs Demo Mode
# ============================================================
# These flags let you switch between two views without restarting:
#
#   DEBUG MODE (all true) — full information for development:
#     - FPS counter visible
#     - Depth heatmap PIP in bottom-right corner
#     - Lane fill + lane lines overlaid on the road
#
#   DEMO MODE (all false except show_fps) — clean portfolio recording:
#     - No depth heatmap clutter
#     - No lane fill overlay
#     - Just detection boxes, risk labels, and the collision warning banner
#
# Tip: record your demo video with show_depth_panel and show_lane_overlay
# set to false for a polished, presentation-ready output.
visualization:
  # Show/hide the FPS counter in the top-left HUD strip.
  show_fps: true

  # Show/hide the colorized depth heatmap picture-in-picture overlay.
  # Note: the depth MODEL still runs; this only hides the on-screen panel.
  # Controlled here (not under depth:) so both toggles are in one place.
  show_depth_panel: true

  # Show/hide the translucent lane fill and lane line overlays.
  # Set to false for a cleaner demo view that focuses on the alert system.
  show_lane_overlay: true
